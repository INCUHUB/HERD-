.brandmark { padding: 32px 0 26px; }
.brandmark img { display:block; width:190px; max-width:46vw; height:auto; }
.brandmark .dk { display:none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .brandmark .lt { display:none; }
  :root:not([data-theme="light"]) .brandmark .dk { display:block; }
}
:root[data-theme="dark"] .brandmark .lt { display:none; }
:root[data-theme="dark"] .brandmark .dk { display:block; }
.band-rail { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; color:var(--muted); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:11px 0; }
.band h1 { font-family:"Bodoni Moda", Didot, Georgia, serif; font-weight:400; font-size:clamp(2.4rem,7.5vw,4.8rem); line-height:.98; letter-spacing:-.02em; margin:30px 0 0; text-wrap:balance; color:var(--ink); }
.band h1 em { font-style: italic; }
.band h1 .thin { opacity:.38; }
.band .sub { max-width:54ch; color:var(--ink-2); font-size:1.02rem; margin:20px 0 30px; }
.tally { display:flex; align-items:center; gap:16px; flex-wrap:wrap; border-top:1px solid var(--rule); padding:14px 0 30px; }
.tally .num { font-family:"IBM Plex Mono", monospace; font-size:12px; letter-spacing:.1em; font-variant-numeric:tabular-nums; color:var(--muted); white-space:nowrap; }
.tally .track { flex:1 1 150px; min-width:110px; height:3px; background:var(--rule-soft); overflow:hidden; }
.tally .fill { height:100%; width:0; background:var(--ink); transition:width .28s ease; }
.savepill { font-family:"IBM Plex Mono", monospace; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; padding:5px 10px; border:1px solid var(--rule); color:var(--muted); white-space:nowrap; }
.savepill.on { color:var(--ink); border-color:var(--muted); }
.savepill.warn { color:var(--rust); border-color:var(--rust); }

   and a wordmark, so the page drops its own masthead and keeps the parts
   that carry information: the address rail, the progress meter and the
   save state. */

:root[data-embed] .brandmark,
:root[data-embed] .band h1,
:root[data-embed] .band .sub { display:none; }

.blk { position:absolute; top:15px; height:28px; border-radius:2px; display:flex; align-items:center; padding:0 8px;

.tags { display:flex; gap:7px; flex-wrap:wrap; }

.sheet-head h3 { margin:0; font-family:"IBM Plex Mono", monospace; font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--pine-ink); }
.sheet-head .when { color:var(--muted); font-family:"IBM Plex Mono", monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; }
.ownerbar { display:flex; align-items:center; gap:8px; padding:9px 16px 4px; border-bottom:1px solid var(--rule-soft); }
.ownerbar label { font-family:"IBM Plex Mono", monospace; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }

}
input.f::placeholder, textarea.f::placeholder { color:var(--muted); }

ul.checks { list-style:none; margin:0; padding:4px 16px 0; display:flex; flex-direction:column; }

/* ── outreach ── */

    { id:"short", title:"Short", len:"About 80 words", cls:"",
      html:"<p>" + "HERD is an independent men's and women's clothing and lifestyle store at 11 Lower Hillgate, in Stockport's Underbanks. It opened in August 2026 with sixteen labels on the floor, among them Universal Works, District Vision, OpéraSPORT, Another Aspect, Baserange, Colorful Standard and Puebco, chosen piece by piece rather than bought by the rail. Still By Hand, Café Mountain, Ordinary Fits, WYRD Running, Meals, LF Markey, Ends and Means, Service Works and Stutterheim land for AW26, with Goldwin following for SS27. The shop was launched in partnership with INCU, the Manchester brand incubator." + "</p>", plain:"HERD is an independent men's and women's clothing and lifestyle store at 11 Lower Hillgate, in Stockport's Underbanks. It opened in August 2026 with sixteen labels on the floor, among them Universal Works, District Vision, OpéraSPORT, Another Aspect, Baserange, Colorful Standard and Puebco, chosen piece by piece rather than bought by the rail. Still By Hand, Café Mountain, Ordinary Fits, WYRD Running, Meals, LF Markey, Ends and Means, Service Works and Stutterheim land for AW26, with Goldwin following for SS27. The shop was launched in partnership with INCU, the Manchester brand incubator." },
    { id:"long", title:"Full", len:"About 210 words", cls:"",
      html:"<p>HERD is an independent men's and women's clothing and lifestyle store at 11 Lower Hillgate, on Stockport's Underbanks. It opened in August 2026.</p><p>The buy is deliberately narrow. Sixteen labels are on the floor to start: Universal Works, District Vision, OpéraSPORT, Another Aspect, Baserange, Colorful Standard, Puebco, Maria Black, Akila, Unna, Tanchen, Wollow, Rus, socksss, Vyrao and Midnight 00.00. Copenhagen and Nottingham as much as Tokyo and New York. Pieces are chosen one at a time rather than bought by the rail, and the shop leans towards clothes meant to be worn for years rather than seasons. AW26 brings the next wave: Still By Hand, Café Mountain, Ordinary Fits, WYRD Running, Meals, LF Markey, Ends and Means, Service Works and Stutterheim. Goldwin follows for SS27, with more to come.</p><p>HERD was launched in partnership with INCU, the Manchester brand incubator, which has backed the funding, the premises, the fit out and the brand launch. The team between them has more than twenty years in retail and fashion.</p><p>The shop sits among the Underbanks' independents. Bohemian, Yellowhammer, Hillgate Cakery, Convene and Little Scalfs are all within a few doors, on a street that has quietly become one of Greater Manchester's more interesting places to shop.</p>", plain:"HERD is an independent men's and women's clothing and lifestyle store at 11 Lower Hillgate, on Stockport's Underbanks. It opened in August 2026.\n\nThe buy is deliberately narrow. Sixteen labels are on the floor to start: Universal Works, District Vision, OpéraSPORT, Another Aspect, Baserange, Colorful Standard, Puebco, Maria Black, Akila, Unna, Tanchen, Wollow, Rus, socksss, Vyrao and Midnight 00.00. Copenhagen and Nottingham as much as Tokyo and New York. Pieces are chosen one at a time rather than bought by the rail, and the shop leans towards clothes meant to be worn for years rather than seasons. AW26 brings the next wave: Still By Hand, Café Mountain, Ordinary Fits, WYRD Running, Meals, LF Markey, Ends and Means, Service Works and Stutterheim. Goldwin follows for SS27, with more to come.\n\nHERD was launched in partnership with INCU, the Manchester brand incubator, which has backed the funding, the premises, the fit out and the brand launch. The team between them has more than twenty years in retail and fashion.\n\nThe shop sits among the Underbanks' independents. Bohemian, Yellowhammer, Hillgate Cakery, Convene and Little Scalfs are all within a few doors, on a street that has quietly become one of Greater Manchester's more interesting places to shop." },

  var STATUSES = [
    ["todo","Not started"], ["verify","Verify first"], ["approached","Approached"],
    ["replied","Replied"], ["booked","Booked in"], ["covered","Covered"],
    ["declined","Declined"], ["parked","Parked"]
  ];

  var DAYS = {
    wed: { blocks:[{s:12,e:13.7,cls:"visit",label:"12:00 Flâneuse"}], notes:[] },
    thu: { blocks:[
      {s:8.25,e:9.45,cls:"prep",label:"08:15 Open"},
      {s:9.5,e:11,cls:"visit",label:"09:30 Life in Manny"},
      {s:11.05,e:12.0,cls:"prep",label:"11:00 Reset"},
      {s:14,e:15.6,cls:"visit",label:"14:00 The Manc"}
    ], notes:[{s:12.15,label:"2¼ hr clear"}] }
  };


  var COPY = {};
  PRESS.forEach(function (b) { COPY[b.id] = b.plain; });

  /* ══════════ STATE ══════════ */
  var state;
  try { state = JSON.parse(document.getElementById("stateData").textContent) || {}; }
  catch (e) { state = {}; }
  state.v = 1;
  state.checks = state.checks || {};
  state.owners = state.owners || {};
  state.outreach = state.outreach || {};
  state.extra = state.extra || [];
  state.coverage = state.coverage || [];

  var shared = null;       // artifact capability namespace, once resolved
  var readOnly = false;
  var localOnly = false;
  var LKEY = "herd-press-week-local";

  function loadLocal() {
    try {
      var raw = window.localStorage.getItem(LKEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      ["checks","owners","outreach","extra","coverage"].forEach(function (k) {
        if (s && s[k]) state[k] = s[k];
      });
    } catch (e) {}
  }
  function saveLocal() {
    try { window.localStorage.setItem(LKEY, JSON.stringify(state)); } catch (e) {}
  }

  /* ══════════ ESCAPING / DOM HELPERS ══════════ */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  /* ══════════ SAVE PIPELINE ══════════ */
  var pill, saveTimer = null, pending = false;
  var pillState = { text: "Connecting…", cls: "" };

  function setPill(text, cls) {
    pillState = { text: text, cls: cls || "" };
    if (!pill) return;
    pill.textContent = text;
    pill.className = "savepill" + (cls ? " " + cls : "");
  }

  var rev = 0;
  var poller = null;
  var inflight = false;

  function commit() {
    saveLocal();
    if (readOnly) return;
    pending = true;
    setPill("Unsaved", "warn");
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 700);
  }

  function adopt(payload) {
    rev = payload.rev || 0;
    var st = payload.state || {};
    ["checks","owners","outreach","extra","coverage"].forEach(function (k) {
      state[k] = st[k] || (k === "extra" || k === "coverage" ? [] : {});
    });
    saveLocal();
    render();
  }

  function flush() {
    saveTimer = null;
    if (readOnly || !pending || inflight) return;
    inflight = true;
    pending = false;
    setPill("Saving", "on");
    fetch(API, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rev: rev, state: state })
    }).then(function (r) {
      return r.json().then(function (body) { return { ok: r.ok, status: r.status, body: body }; });
    }).then(function (res) {
      inflight = false;
      if (res.ok) {
        rev = res.body.rev;
        setPill("Saved for the team", "on");
        return;
      }
      if (res.status === 409) {
        setPill("Someone else saved, reloading", "warn");
        adopt(res.body);
        setPill("Reloaded", "on");
        return;
      }
      if (res.status === 401 || res.status === 403) {
        readOnly = true; markReadOnly(); return;
      }
      pending = true;
      setPill("Save failed, retrying", "warn");
      if (!saveTimer) saveTimer = setTimeout(flush, 4000);
    }).catch(function () {
      inflight = false;
      pending = true;
      setPill("Offline, saved on this device", "warn");
      if (!saveTimer) saveTimer = setTimeout(flush, 6000);
    });
  }

  function poll() {
    if (pending || inflight || readOnly) return;
    fetch(API, { headers: { "Accept": "application/json" } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (p) {
        if (p && p.rev !== rev) { adopt(p); setPill("Updated by the team", "on"); }
      })
      .catch(function () {});
  }

  function markReadOnly() {
    setPill("View only", "warn");
    Array.prototype.forEach.call(
      document.querySelectorAll("#app input, #app select, #app textarea, #app button.act, #app .rowdel"),
      function (n) { n.disabled = true; }
    );
    var b = document.getElementById("roBanner");
    if (b) b.hidden = false;
  }

  /* ══════════ RENDER ══════════ */
  function tally() {
    var boxes = document.querySelectorAll("#app input.tick");
    var done = 0;
    Array.prototype.forEach.call(boxes, function (b) { if (b.checked) done++; });
    var n = document.getElementById("tallyNum");
    var f = document.getElementById("tallyFill");
    if (n) n.textContent = done + " / " + boxes.length + " done";
    if (f) f.style.width = (boxes.length ? (done / boxes.length) * 100 : 0) + "%";
  }

  function pips(v) {
    if (!v) return '<span class="pips"><i class="unk"></i><i class="unk"></i><i class="unk"></i></span>';
    var out = '<span class="pips">';
    for (var i = 1; i <= 3; i++) out += '<i class="' + (i <= v ? "on" : "") + '"></i>';
    return out + "</span>";
  }

  function statusSelect(id, cur) {
    var s = '<select class="f status" data-outreach="' + esc(id) + '" data-s="' + esc(cur) + '" aria-label="Status">';
    STATUSES.forEach(function (o) {
      s += '<option value="' + o[0] + '"' + (o[0] === cur ? " selected" : "") + ">" + esc(o[1]) + "</option>";
    });
    return s + "</select>";
  }

  function strip(key) {
    var START = 8, END = 18.5;
    function pos(h) { return ((h - START) / (END - START)) * 100; }
    var html = "";
    for (var h = 8; h <= 18; h += 2) {
      html += '<div class="tick" style="left:' + pos(h) + '%" data-h="' + (h < 10 ? "0" : "") + h + ':00"></div>';
    }
    DAYS[key].blocks.forEach(function (b) {
      html += '<div class="blk ' + b.cls + '" style="left:' + pos(b.s) + "%;width:" + (pos(b.e) - pos(b.s)) + '%" title="' + esc(b.label) + '">' + esc(b.label) + "</div>";
    });
    DAYS[key].notes.forEach(function (n) {
      html += '<div class="gapnote" style="left:' + pos(n.s) + '%">' + esc(n.label) + "</div>";
    });
    return html;
  }

    VISITS.forEach(function (v) {
      h += '<article class="visit-row"><div class="ord">' + v.ord + '</div><div class="visit-main">' +
        '<div class="slot-meta"><span class="clock">' + v.time + '</span><span class="mono">' + esc(v.day) + "</span></div>" +
        '<h3><a href="' + esc(v.url) + '" target="_blank" rel="noopener">' + esc(v.name) + "</a></h3>" +
        '<p class="who">' + esc(v.who) + "</p>" +
        '<p class="angle"><b>The angle</b>' + esc(v.angle) + "</p><div class=\"tags\">";
      v.tags.forEach(function (t) { h += '<span class="tag' + (t[1] ? " hi" : "") + '">' + esc(t[0]) + "</span>"; });
      h += "</div></div></article>";
    });
    h += "</section>";

    /* checklist */
    h += '<section><div class="sec-head"><h2>Before, during, after</h2><span class="mono">Same for all three</span></div>' +
      '<p class="sec-note">Runs in order. The night-before block is the one that actually decides how the pictures look. Put a name against each block so nothing falls between people.</p>' +
      '<div class="sheets">';
    SHEETS.forEach(function (sh) {
      h += '<div class="sheet"><div class="sheet-head"><h3>' + esc(sh.title) + '</h3><span class="when">' + esc(sh.when) + "</span></div>" +
        '<div class="ownerbar"><label for="own-' + sh.id + '">On it</label>' +
        '<input class="f" id="own-' + sh.id + '" data-owner="' + sh.id + '" placeholder="Name" value="' + esc(state.owners[sh.id] || "") + '"></div>' +
        '<ul class="checks">';
      sh.items.forEach(function (it) {
        h += '<li><label class="check"><input type="checkbox" class="tick" data-k="' + it[0] + '"' +
          (state.checks[it[0]] ? " checked" : "") + '><span class="txt">' + esc(it[1]) +
          (it[2] ? "<small>" + esc(it[2]) + "</small>" : "") + "</span></label></li>";
      });
      h += "</ul></div>";
    });
    h += "</div></section>";

    /* outreach */
    h += '<section><div class="sec-head"><h2>Who\'s next</h2><span class="mono">Ranked by worth your time</span></div>' +
      '<p class="sec-note">Fit is how close their audience sits to what you actually buy; reach is local audience size. Both are judgements, not measurements, anything shown as hatched had no findable size, site or location. Set a status and leave a note as you work through them.</p>';

    var all = CAST.slice();
    state.extra.forEach(function (x) {
      all.push({ id: x.id, name: x.name, handle: x.handle, url: x.url || "", fit: 0, reach: 0,
        fitL: "n/a", reachL: "n/a", def: "todo", read: x.read || "", custom: true });
    });

    all.forEach(function (c, i) {
      var rec = state.outreach[c.id] || {};
      var st = rec.status || c.def;
      var rank = ("0" + (i + 1)).slice(-2);
      h += '<div class="cast-row"><div class="cast-rank">' + rank + '</div><div class="cast-body">' +
        "<h4>" + (c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.name) + "</a>" : esc(c.name)) + "</h4>" +
        '<span class="cast-handle">' + c.handle + "</span>" +
        (c.read ? '<p class="read">' + c.read + "</p>" : "") +
        '<textarea class="f notefield" data-note="' + esc(c.id) + '" placeholder="Notes, who spoke to them, what was said, next step">' + esc(rec.note || "") + "</textarea>" +
        (c.custom ? '<button class="rowdel" data-del="' + esc(c.id) + '">Remove</button>' : "") +
        '</div><div class="cast-side">' +
        '<div class="meter"><span class="lbl">Fit</span>' + pips(c.fit) + '<span class="val">' + esc(c.fitL) + "</span></div>" +
        '<div class="meter"><span class="lbl">Reach</span>' + pips(c.reach) + '<span class="val">' + esc(c.reachL) + "</span></div>" +
        statusSelect(c.id, st) + "</div></div>";
    });

    h += '<div class="addbox"><h3>Add someone to the list</h3><div class="addgrid">' +
      '<input class="f" id="addName" placeholder="Name or outlet">' +
      '<input class="f" id="addHandle" placeholder="@handle">' +
      '<input class="f" id="addUrl" placeholder="Link (optional)">' +
      '<button class="act" id="addBtn">Add</button></div></div>';

    h += "</section>";

    /* press pack */
    h += '<section><div class="sec-head"><h2>Press pack</h2><span class="mono">Copy and send</span></div>' +
      '<p class="sec-note">Written to be pasted straight into a DM, an email or a listing. Every block copies with one click.</p>' +
      '<div class="presswrap">';
    PRESS.forEach(function (b) {
      h += '<div class="pressblock"><div class="ph"><h3>' + esc(b.title) + '</h3><span class="len">' + esc(b.len) + '</span></div>' +
        '<div class="pb ' + b.cls + '" id="press-' + b.id + '">' + b.html + '</div>' +
        '<div class="pressfoot"><button class="copy" data-copy="' + b.id + '">Copy</button></div></div>';
    });
    h += '</div>' +
      '<p class="flag">Two things to settle before this goes out. <b>Hours:</b> one post says Tuesday to Sunday 10am to 6pm, another gives Sunday as 10.30 to 4.30. The pack uses Tuesday to Sunday, 10am to 6pm. <b>Five labels unplaced:</b> Kamakura, Howlin, RoToTo, Gottlob and Nikki Chasin were on the master list but sit in none of the three lists above. Tell me which and I will slot them in.</p>' +
      '</section>';

    /* coverage log */
    h += '<section><div class="sec-head"><h2>Coverage log</h2><span class="mono">What actually ran</span></div>' +
      '<p class="sec-note">Fill this in as things go live. It is the record you will want when the partner vesting gates come round.</p>' +
      '<table class="covtable"><thead><tr><th>Outlet</th><th>Date live</th><th>Link</th><th></th></tr></thead><tbody id="covBody"></tbody></table>' +
      '<div class="addbox"><h3>Log a piece of coverage</h3><div class="addgrid">' +
      '<input class="f" id="covOutlet" placeholder="Outlet">' +
      '<input class="f" id="covDate" placeholder="Date, e.g. 5 Sep">' +
      '<input class="f" id="covLink" placeholder="Link">' +
      '<button class="act" id="covBtn">Log it</button></div></div></section>';

    h += '<div class="banner" id="roBanner" hidden>You are viewing this page without edit access, so your ticks will not save for anyone else. Ask James for edit rights on the share menu.</div>';

    h += '<footer><p>Everything on this page, ticks, names, statuses, notes and the coverage log, saves into the page itself, so anyone with the link sees the same state. Two people editing at once: last save wins, and the other view reloads.</p>' +
      '<p>Account identifications come from public web sources rather than Instagram itself. Fit and reach are judgements, not measurements.</p></footer>';

    h += "</main>";
    h += '<div class="footart"></div>';

    document.getElementById("app").innerHTML = h;
    pill = document.getElementById("savePill");
    pill.textContent = pillState.text;
    pill.className = "savepill" + (pillState.cls ? " " + pillState.cls : "");
    renderCoverage();
    tally();
    if (readOnly) markReadOnly();
  }

  function renderCoverage() {
    var body = document.getElementById("covBody");
    if (!body) return;
    if (!state.coverage.length) {
      body.innerHTML = '<tr><td colspan="4" class="empty">Nothing logged yet.</td></tr>';
      return;
    }
    var h = "";
    state.coverage.forEach(function (c, i) {
      h += "<tr><td>" + esc(c.outlet) + "</td><td>" + esc(c.date) + "</td><td>" +
        (c.link ? '<a href="' + esc(c.link) + '" target="_blank" rel="noopener">' + esc(c.link.replace(/^https?:\/\//, "").slice(0, 42)) + "</a>" : "none") +
        '</td><td><button class="rowdel" data-covdel="' + i + '">Remove</button></td></tr>';
    });
    body.innerHTML = h;
  }

  /* ══════════ EVENTS ══════════ */
  var wired = false;
  function wire() {
    if (wired) return;
    wired = true;
    var app = document.getElementById("app");
    var noteTimer = null;

    app.addEventListener("change", function (e) {
      var t = e.target;
      if (t.classList.contains("tick")) {
        if (t.checked) state.checks[t.dataset.k] = 1; else delete state.checks[t.dataset.k];
        tally(); commit();
      } else if (t.dataset.outreach) {
        var id = t.dataset.outreach;
        state.outreach[id] = state.outreach[id] || {};
        state.outreach[id].status = t.value;
        t.setAttribute("data-s", t.value);
        commit();
      }
    });

    app.addEventListener("input", function (e) {
      var t = e.target;
      if (t.dataset.owner) {
        state.owners[t.dataset.owner] = t.value;
      } else if (t.dataset.note) {
        var id = t.dataset.note;
        state.outreach[id] = state.outreach[id] || {};
        state.outreach[id].note = t.value;
      } else return;
      if (noteTimer) clearTimeout(noteTimer);
      noteTimer = setTimeout(commit, 500);
    });

    app.addEventListener("click", function (e) {
      var t = e.target;
      if (t.dataset.copy) {
        var payload = COPY[t.dataset.copy] || "";
        var done = function () {
          t.textContent = "Copied";
          t.classList.add("done");
          setTimeout(function () { t.textContent = "Copy"; t.classList.remove("done"); }, 1800);
        };
        var fallback = function () {
          var node = document.getElementById("press-" + t.dataset.copy);
          if (!node) return;
          var r = document.createRange();
          r.selectNodeContents(node);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
          t.textContent = "Selected, press \u2318C";
          setTimeout(function () { t.textContent = "Copy"; }, 2600);
        };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(payload).then(done, fallback);
          } else { fallback(); }
        } catch (err) { fallback(); }
        return;
      }
      if (t.id === "addBtn") {
        var n = document.getElementById("addName").value.trim();
        if (!n) { document.getElementById("addName").focus(); return; }
        var hd = document.getElementById("addHandle").value.trim();
        var u = document.getElementById("addUrl").value.trim();
        if (u && !/^https?:\/\//i.test(u)) u = "https://" + u;
        state.extra.push({
          id: "x" + Date.now().toString(36),
          name: n, handle: esc(hd || "Added by the team"), url: u, read: ""
        });
        render(); commit(); wireFocus("addName");
      } else if (t.id === "covBtn") {
        var o = document.getElementById("covOutlet").value.trim();
        if (!o) { document.getElementById("covOutlet").focus(); return; }
        var lk = document.getElementById("covLink").value.trim();
        if (lk && !/^https?:\/\//i.test(lk)) lk = "https://" + lk;
        state.coverage.push({ outlet: o, date: document.getElementById("covDate").value.trim(), link: lk });
        render(); commit(); wireFocus("covOutlet");
      } else if (t.dataset.del) {
        var did = t.dataset.del;
        state.extra = state.extra.filter(function (x) { return x.id !== did; });
        delete state.outreach[did];
        render(); commit();
      } else if (t.dataset.covdel) {
        state.coverage.splice(parseInt(t.dataset.covdel, 10), 1);
        commit(); renderCoverage();
      }
    });

    window.addEventListener("beforeunload", function () { if (pending) flush(); });
  }

  function wireFocus(id) {
    var n = document.getElementById(id);
    if (n) n.focus();
    if (readOnly) markReadOnly();
  }

  /* ══════════ BOOT ══════════ */
  loadLocal();
  render();
  wire();

  fetch(API, { headers: { "Accept": "application/json" } })
    .then(function (r) {
      if (r.status === 401 || r.status === 403) { readOnly = true; markReadOnly(); return null; }
      return r.ok ? r.json() : null;
    })
    .then(function (p) {
      if (p) { adopt(p); setPill("Shared with the team", "on"); }
      else if (!readOnly) { setPill("Saved on this device only", "warn"); }
      poller = setInterval(poll, 12000);
    })
    .catch(function () {
      setPill("Saved on this device only", "warn");
      poller = setInterval(poll, 20000);
    });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) poll();
  });
})();
</script>
</body>
</html>
